name: Release

# Every push to main:
#   1. Computes the next patch version (bumps the most recent v*.*.* tag,
#      or starts at v0.1.0 if there are no tags yet).
#   2. Zips the skill contents (SKILL.md + references/ + assets/) into a
#      single archive ready to drop into ~/.claude/skills/.
#   3. Creates a git tag at the new version.
#   4. Creates a GitHub release with that tag and attaches the zip.
#
# Free on public repos. Uses the built-in GITHUB_TOKEN. No external services.
#
# To skip a release for a commit (e.g. a typo fix), include "[skip release]"
# anywhere in the commit message.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # Find the latest v*.*.* tag, default to v0.0.0 if none exist.
          # Then bump the patch component.
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          # Strip the leading v and split on dots.
          IFS='.' read -r major minor patch <<< "${latest#v}"
          patch=$((patch + 1))
          next="v${major}.${minor}.${patch}"
          echo "Latest tag: $latest"
          echo "Next tag:   $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Build skill zip
        run: |
          # Zip the skill files into a single archive. The internal directory
          # is named verso-presentation-skill/ so it extracts cleanly into
          # ~/.claude/skills/ without renaming.
          mkdir -p _release/verso-presentation-skill
          cp -r SKILL.md references assets _release/verso-presentation-skill/
          cd _release
          zip -r "../verso-presentation-skill-${{ steps.version.outputs.version }}.zip" verso-presentation-skill
          cd ..
          ls -la verso-presentation-skill-*.zip

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **Drop into Claude as a skill:**

            ```sh
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/verso-presentation-skill-${{ steps.version.outputs.version }}.zip \
              -o /tmp/verso-skill.zip
            unzip -o /tmp/verso-skill.zip -d ~/.claude/skills/
            ```

            Then `claude` will load the skill on next start.

            ---

            Built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: verso-presentation-skill-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
